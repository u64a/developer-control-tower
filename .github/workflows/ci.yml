name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages*.lock.json

      - name: Validate public source boundary
        shell: pwsh
        run: .\Test-PublicSourceBoundary.ps1

      - name: Restore locked dependencies
        run: dotnet restore DeveloperControlTower.sln --locked-mode --nologo

      - name: Build
        run: dotnet build DeveloperControlTower.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test DeveloperControlTower.sln -c Release --no-build --nologo

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: .\Test-NuGetVulnerabilities.ps1
