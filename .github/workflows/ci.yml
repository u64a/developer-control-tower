name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages*.lock.json

      - name: Validate public source boundary
        shell: pwsh
        run: .\Test-PublicSourceBoundary.ps1

      - name: Restore locked dependencies
        run: dotnet restore DeveloperControlTower.sln --locked-mode --nologo

      - name: Build
        run: dotnet build DeveloperControlTower.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test DeveloperControlTower.sln -c Release --no-build --nologo

      # Guards the source-install path, which the release job never exercises:
      # it publishes with an explicit RID, so a RID-less regression (such as
      # ReadyToRun failing to infer one) is invisible there while breaking
      # both Install-DeveloperControlTower.ps1 and the in-place updater.
      - name: Verify source-install publish path
        shell: pwsh
        run: |
          $project = 'src\ControlTower.Desktop\ControlTower.Desktop.csproj'
          $stage = Join-Path $env:RUNNER_TEMP 'source-install-check'
          dotnet restore $project --locked-mode --nologo
          if ($LASTEXITCODE -ne 0) {
            throw "Locked restore of the desktop project failed."
          }
          dotnet publish $project -c Release --no-self-contained --no-restore --nologo -o $stage
          if ($LASTEXITCODE -ne 0) {
            throw "The RID-less publish used by Install-DeveloperControlTower.ps1 and the in-place updater failed."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'ControlTower.Desktop.exe'))) {
            throw "The source-install publish produced no executable."
          }
          $dirty = git status --porcelain
          if ($dirty) {
            throw "Restore or publish modified tracked files (lock files must stay unchanged):`n$dirty"
          }

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: .\Test-NuGetVulnerabilities.ps1
