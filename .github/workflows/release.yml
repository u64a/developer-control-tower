name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/packages*.lock.json

      - name: Validate tag and project version
        id: version
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.Substring(1)
          [xml]$project = Get-Content 'src\ControlTower.Desktop\ControlTower.Desktop.csproj' -Raw
          $projectVersion = [string](($project.Project.PropertyGroup | Where-Object Version | Select-Object -First 1).Version)
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }
          "value=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Build locked release packages
        shell: pwsh
        run: .\Build-ReleasePackages.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .artifacts/release/publish
          format: spdx-json
          artifact-name: DeveloperControlTower.spdx.json
          output-file: .artifacts/release/DeveloperControlTower.spdx.json
          dependency-snapshot: true
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .artifacts/release/releases/**/*
            .artifacts/release/DeveloperControlTower.spdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .artifacts/release/releases/**/*.exe
            .artifacts/release/releases/**/*.zip
            .artifacts/release/releases/**/*.nupkg
          sbom-path: .artifacts/release/DeveloperControlTower.spdx.json

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = '${{ steps.version.outputs.value }}'
          $assets = @(
            Get-ChildItem '.artifacts\release\releases' -Recurse -File |
              Select-Object -ExpandProperty FullName
          )
          $assets += (Resolve-Path '.artifacts\release\DeveloperControlTower.spdx.json').Path
          $arguments = @(
            'release', 'create', $tag,
            '--verify-tag',
            '--draft',
            '--title', "Developer Control Tower $version",
            '--generate-notes'
          )
          if ($version.Contains('-')) {
            $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Creating the draft release failed with exit code $LASTEXITCODE."
          }

          & gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading release assets failed with exit code $LASTEXITCODE. The release remains a draft."
          }

          & gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the draft release failed with exit code $LASTEXITCODE."
          }
