name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private repository content, customer data, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the app title bar or executable properties.
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - win-x64
        - win-arm64
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace type
      options:
        - Local
        - SSH
        - Hosted-only
        - Hybrid
        - Not workspace-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Provide minimal, safe steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal paths, private repository data, and customer information.
          required: true
