kind: developer-control-tower/settings
schema_version: 1

tooling:
  vscode_command: code
  git_command: git
  ssh_command: ssh
  ssh_config_path:
  # Optional; auto-detected (wt.exe / pwsh.exe) when empty.
  terminal_command:
  powershell_command:

security:
  allow_http_links: false
  github_credential_target: DCT-GitHub
  ado_credential_target: DCT-Ado

# Local safety-net for forked repos. Projects whose Group is exactly
# "Archive" (case-insensitive) get a full clone kept here, refreshed when you
# choose "Sync all archives now", and never deleted locally even if the
# upstream GitHub repo disappears (e.g. a DMCA takedown). The app also makes
# one guarded attempt automatically each time it starts (after your portfolio
# has loaded) — same safety checks as the manual action, no popup, no timer;
# a refusal only shows as a status/row message you can act on.
# Leave empty to use %USERPROFILE%\DeveloperControlTower\Archive. This is the
# one root for every archive project; project.yml archive.path entries are
# legacy and ignored. A non-empty value may be any fully qualified local
# folder (including another drive), but not a drive/profile root, network or
# device path, mapped-network drive alias, junction, or app-install folder.
# An invalid setting disables archive syncing until corrected.
archive:
  storage_root:

# How projects open. Built-ins: vscode (default), copilot-cli, claude-code.
# Override per project with the row's right-click "Launch environment" menu
# (stored as launch.environment in the project's project.yml).
launch:
  default_environment: vscode
  # environments:
  #   claude-code:
  #     args: --continue
  #   aider:
  #     name: Aider
  #     type: terminal          # terminal (PowerShell in Windows Terminal) or editor (VS Code-style)
  #     command: aider
  #     args: --dark-mode
  #     remote_command: aider   # run on the host for SSH-only projects
  #     icon: C:\Tools\aider.ico  # optional; otherwise read from the installed executable
